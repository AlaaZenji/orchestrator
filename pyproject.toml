[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-platform"
version = "0.1.0"
description = "Durable AI Agent Orchestration Platform — Production Reference Implementation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AlaaZenji", email = "alaa.zingi.2004@gmail.com" },
]
keywords = ["orchestrator", "ai-agent", "durable-execution", "fencing", "leases", "mcp", "cloudevents", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
sqlite = []
test = ["pytest>=7", "hypothesis>=6.0", "pyyaml>=6.0"]

[project.scripts]
orchestrator = "orchestrator.cli.main:main"
orchestrator-setup = "orchestrator_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/AlaaZenji/orchestrator"
Repository = "https://github.com/AlaaZenji/orchestrator"
Issues = "https://github.com/AlaaZenji/orchestrator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchestrator_runtime" = [
    "templates/scripts/*.py",
    "templates/prompts/*.md",
    "templates/docs/*.md",
    "templates/migrations/postgres/*.sql",
    "templates/migrations/sqlite/*.sql",
    "global_slash_commands/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
