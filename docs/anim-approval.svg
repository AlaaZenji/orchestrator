<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Approval Gate animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">8. APPROVAL GATE</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">human-in-the-loop with fencing</text>

  <!-- Ticket card with state transition -->
  <g transform="translate(36, 90)">
    <rect width="408" height="140" rx="6" fill="#020617" stroke="#1e293b"/>

    <!-- Header -->
    <text x="14" y="22" font-family="monospace" font-size="10" fill="#94a3b8">TKT-P0-099</text>
    <text x="14" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">high-risk: schema migration</text>

    <!-- State indicator -->
    <g transform="translate(14, 52)">
      <!-- PENDING -->
      <rect width="120" height="32" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5">
        <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <circle cx="14" cy="16" r="4" fill="#f59e0b">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="20" font-family="monospace" font-size="10" fill="#f59e0b">PENDING</text>

      <!-- Arrow -->
      <line x1="128" y1="16" x2="170" y2="16" stroke="#475569" stroke-width="1"/>
      <text x="149" y="11" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">→</text>

      <!-- APPROVED (appears at 3s) -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3s" fill="freeze"/>
        <rect x="178" width="120" height="32" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
        <circle cx="192" cy="16" r="4" fill="#22c55e"/>
        <text x="204" y="20" font-family="monospace" font-size="10" fill="#22c55e">APPROVED</text>
      </g>
    </g>

    <!-- Approval artifact details -->
    <text x="14" y="106" font-family="monospace" font-size="9" fill="#64748b">approval_id:</text>
    <text x="90" y="106" font-family="monospace" font-size="9" fill="#94a3b8">apr-2026-001</text>
    <text x="200" y="106" font-family="monospace" font-size="9" fill="#64748b">v3:</text>
    <text x="218" y="106" font-family="monospace" font-size="9" fill="#94a3b8">tok=1042</text>

    <text x="14" y="124" font-family="monospace" font-size="9" fill="#64748b">bound to:</text>
    <text x="68" y="124" font-family="monospace" font-size="9" fill="#94a3b8">ticket_version</text>
    <text x="220" y="124" font-family="monospace" font-size="9" fill="#94a3b8">(no replay)</text>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">Kleppmann fencing · no replay attacks</text>
</svg>
