<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Fitness Gates animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">9. FITNESS GATES</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">8 atomic CI checks · one per non-negotiable</text>

  <!-- 8 gates in 2x4 grid -->
  <g transform="translate(36, 92)">
    <!-- Gate 1: non-negotiables-met -->
    <g>
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">non-negotiables</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0s" fill="freeze"/>
    </g>
    <g transform="translate(106, 0)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">multi-tenant</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.1s" fill="freeze"/>
    </g>
    <g transform="translate(212, 0)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">synthetic-data</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze"/>
    </g>
    <g transform="translate(318, 0)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">ai-safety</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 50)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">offline-first</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze"/>
    </g>
    <g transform="translate(106, 50)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">ext-validation</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
    </g>
    <g transform="translate(212, 50)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">dep-audit</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.6s" fill="freeze"/>
    </g>
    <g transform="translate(318, 50)">
      <rect width="96" height="36" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#22c55e"/>
      <text x="20" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
      <text x="28" y="22" font-family="monospace" font-size="8" fill="#94a3b8">adr-observed</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze"/>
    </g>
  </g>

  <!-- Result -->
  <g transform="translate(36, 196)">
    <rect width="408" height="32" rx="4" fill="#022c1a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="14" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#22c55e">8/8 PASS</text>
    <text x="80" y="20" font-family="monospace" font-size="10" fill="#94a3b8">ready to merge</text>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">CI gate before every merge</text>
</svg>
