<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="orchestrator-runtime">
  <title>orchestrator-runtime</title>

  <defs>
    <!-- Background gradient: deep navy → midnight -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent gradient: emerald → cyan -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- Decorative concentric rings (orchestration motif) — right side -->
  <g transform="translate(1080, 160)" opacity="0.9">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <!-- Inner pulsing dot -->
    <circle cx="0" cy="0" r="6" fill="#22c55e" filter="url(#glow)"/>
    <!-- Orbital nodes -->
    <circle cx="140" cy="0" r="4" fill="#06b6d4" opacity="0.8"/>
    <circle cx="-110" cy="60" r="4" fill="#3b82f6" opacity="0.8"/>
    <circle cx="-70" cy="-90" r="4" fill="#22c55e" opacity="0.8"/>
    <circle cx="60" cy="120" r="4" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Connecting lines (orchestration flow) -->
  <g stroke="#22c55e" stroke-width="1" opacity="0.3" fill="none">
    <line x1="200" y1="60" x2="1080" y2="160"/>
    <line x1="200" y1="260" x2="1080" y2="160"/>
  </g>

  <!-- Title -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-2">
    orchestrator-runtime
  </text>

  <!-- Gradient underline -->
  <rect x="60" y="148" width="540" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Tagline -->
  <text x="60" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    The orchestrator that makes any AI coding agent ~70% faster.
  </text>

  <!-- Sub-tagline: protocol features -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', monospace" font-size="13" font-weight="500">
    <text x="60" y="245" fill="#94a3b8">small-scope tickets</text>
    <text x="240" y="245" fill="#475569">·</text>
    <text x="258" y="245" fill="#94a3b8">write-files-first</text>
    <text x="430" y="245" fill="#475569">·</text>
    <text x="448" y="245" fill="#94a3b8">heartbeat every 5 calls</text>

    <text x="60" y="272" fill="#94a3b8">Kleppmann monotonic fencing</text>
    <text x="298" y="272" fill="#475569">·</text>
    <text x="316" y="272" fill="#94a3b8">3-min watchdog</text>
    <text x="440" y="272" fill="#475569">·</text>
    <text x="458" y="272" fill="#94a3b8">transactional outbox</text>
  </g>

  <!-- Accent corner brackets (top-left) -->
  <g stroke="#22c55e" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="20,40 20,20 40,20"/>
    <polyline points="1260,40 1260,20 1240,20" stroke="#3b82f6"/>
  </g>

  <!-- Accent corner brackets (bottom-right) -->
  <g stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="1260,280 1260,300 1240,300"/>
    <polyline points="20,280 20,300 40,300" stroke="#f59e0b"/>
  </g>
</svg>
