<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="orchestrator-runtime">
  <title>orchestrator-runtime</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- Multi-ring orchestration motif with 6 capability nodes -->
  <g transform="translate(1080, 160)" opacity="0.95">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#22c55e" filter="url(#glow)"/>

    <!-- 6 capability nodes (matching the 13 capabilities, simplified to 6 phases) -->
    <circle cx="140" cy="0" r="5" fill="#3b82f6" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-110" cy="60" r="5" fill="#22c55e" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-70" cy="-90" r="5" fill="#f59e0b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="60" cy="120" r="5" fill="#06b6d4" opacity="0.9" filter="url(#glow)"/>
    <circle cx="100" cy="-80" r="5" fill="#a855f7" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-120" cy="-40" r="5" fill="#ef4444" opacity="0.9" filter="url(#glow)"/>

    <!-- Labels -->
    <text x="140" y="-10" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="middle">discovery</text>
    <text x="-110" y="78" font-family="monospace" font-size="9" fill="#22c55e" text-anchor="middle">execute</text>
    <text x="-70" y="-104" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">govern</text>
    <text x="60" y="138" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">observe</text>
    <text x="100" y="-94" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">verify</text>
    <text x="-120" y="-26" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">ticket</text>
  </g>

  <g stroke="#22c55e" stroke-width="1" opacity="0.3" fill="none">
    <line x1="200" y1="60" x2="1080" y2="160"/>
    <line x1="200" y1="260" x2="1080" y2="160"/>
  </g>

  <text x="60" y="100" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-2">
    orchestrator-runtime
  </text>

  <rect x="60" y="115" width="620" height="3" fill="url(#accent)" rx="1.5"/>

  <text x="60" y="158" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
    Complete AI engineering operations platform.
  </text>

  <text x="60" y="184" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Discovery → Tickets → Verification → Execution → Governance → Observability
  </text>

  <g font-family="-apple-system, system-ui, monospace" font-size="13" font-weight="500">
    <text x="60" y="232" fill="#94a3b8">13 capabilities</text>
    <text x="180" y="232" fill="#475569">·</text>
    <text x="196" y="232" fill="#94a3b8">53+ scripts</text>
    <text x="296" y="232" fill="#475569">·</text>
    <text x="312" y="232" fill="#94a3b8">20+ slash commands</text>
    <text x="465" y="232" fill="#475569">·</text>
    <text x="481" y="232" fill="#94a3b8">multi-agent</text>

    <text x="60" y="258" fill="#94a3b8">Kleppmann fencing</text>
    <text x="200" y="258" fill="#475569">·</text>
    <text x="216" y="258" fill="#94a3b8">RLS-ready Postgres</text>
    <text x="378" y="258" fill="#475569">·</text>
    <text x="394" y="258" fill="#94a3b8">self-improving</text>
    <text x="513" y="258" fill="#475569">·</text>
    <text x="529" y="258" fill="#94a3b8">~70% stall reduction</text>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="20,40 20,20 40,20"/>
    <polyline points="1260,40 1260,20 1240,20" stroke="#3b82f6"/>
  </g>
  <g stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="1260,280 1260,300 1240,300"/>
    <polyline points="20,280 20,300 40,300" stroke="#f59e0b"/>
  </g>
</svg>
