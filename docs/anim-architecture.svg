<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Architecture Audit animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">5. ARCHITECTURE AUDIT</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">intended vs actual · drift detection</text>

  <!-- Two columns: INTENDED vs ACTUAL -->
  <g transform="translate(36, 90)">
    <text x="0" y="0" font-family="monospace" font-size="9" font-weight="700" fill="#3b82f6">INTENDED</text>
    <text x="220" y="0" font-family="monospace" font-size="9" font-weight="700" fill="#22c55e">ACTUAL</text>

    <!-- Lines connecting -->
    <g stroke="#22c55e" stroke-width="1" opacity="0.6" fill="none">
      <line x1="160" y1="22" x2="220" y2="22">
        <animate attributeName="stroke-dasharray" values="0 60;60 0" dur="1.5s" fill="freeze"/>
      </line>
      <line x1="160" y1="46" x2="220" y2="46">
        <animate attributeName="stroke-dasharray" values="0 60;60 0" dur="1.5s" begin="0.2s" fill="freeze"/>
      </line>
    </g>
    <!-- DRIFT (red dashed) -->
    <line x1="160" y1="70" x2="220" y2="94" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </line>

    <!-- INTENDED items -->
    <g font-family="monospace" font-size="10" fill="#94a3b8">
      <text x="0" y="22">RLS on all tables</text>
      <text x="0" y="46">offline-first sync</text>
      <text x="0" y="70">idempotency_key</text>
      <text x="0" y="94">audit log immutable</text>
    </g>

    <!-- ACTUAL items -->
    <g font-family="monospace" font-size="10" fill="#94a3b8">
      <text x="220" y="22">✓ RLS enabled</text>
      <text x="220" y="46">✓ outbox pattern</text>
      <text x="220" y="94">✓ hash chain</text>
      <text x="220" y="118" fill="#ef4444">✗ missing key</text>
    </g>

    <!-- DRIFT badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
      <rect x="240" y="106" width="64" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="272" y="120" font-family="monospace" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">DRIFT</text>
    </g>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">3 drifts · 1 critical · orch-self filed</text>
</svg>
