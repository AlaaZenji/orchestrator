<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Vision Reconciliation animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">7. VISION RECONCILIATION</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">world model vs project state</text>

  <!-- Two streams converging -->
  <g transform="translate(36, 100)">
    <!-- LEFT: world model -->
    <rect x="0" y="0" width="140" height="120" rx="6" fill="#020617" stroke="#a855f7"/>
    <text x="10" y="18" font-family="monospace" font-size="9" fill="#a855f7">world-model/</text>
    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="10" y="36">vision.yaml</text>
      <text x="10" y="50">opportunities.yaml</text>
      <text x="10" y="64">decisions.yaml</text>
      <text x="10" y="78">capabilities.yaml</text>
      <text x="10" y="92">workflows.yaml</text>
    </g>

    <!-- RIGHT: project state -->
    <rect x="268" y="0" width="140" height="120" rx="6" fill="#020617" stroke="#22c55e"/>
    <text x="278" y="18" font-family="monospace" font-size="9" fill="#22c55e">project/</text>
    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="278" y="36">tickets/TKT-*.md</text>
      <text x="278" y="50">progress/*.md</text>
      <text x="278" y="64">STATE.md</text>
      <text x="278" y="78">tickets-index.md</text>
      <text x="278" y="92">blockers-index.md</text>
    </g>

    <!-- Center: reconciler -->
    <circle cx="204" cy="60" r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5">
      <animate attributeName="r" values="22;26;22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="204" y="56" font-family="monospace" font-size="8" fill="#06b6d4" text-anchor="middle">RECON-</text>
    <text x="204" y="68" font-family="monospace" font-size="8" fill="#06b6d4" text-anchor="middle">CILE</text>

    <!-- Connection lines -->
    <line x1="142" y1="36" x2="182" y2="50" stroke="#a855f7" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="142" y1="60" x2="182" y2="60" stroke="#a855f7" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="142" y1="84" x2="182" y2="70" stroke="#a855f7" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="226" y1="50" x2="266" y2="36" stroke="#22c55e" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="226" y1="60" x2="266" y2="60" stroke="#22c55e" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="226" y1="70" x2="266" y2="84" stroke="#22c55e" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>

    <!-- Drift indicator -->
    <text x="204" y="100" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">2 drifts</text>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">closes the silent-rot gap</text>
</svg>
