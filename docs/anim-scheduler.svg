<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Resource Scheduler animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">10. RESOURCE SCHEDULER</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">macOS CPU/RAM probe + cap</text>

  <!-- CPU gauge -->
  <g transform="translate(36, 90)">
    <text x="0" y="14" font-family="monospace" font-size="10" fill="#64748b">CPU</text>
    <rect x="40" y="4" width="280" height="16" rx="8" fill="#1e293b"/>
    <rect x="40" y="4" width="0" height="16" rx="8" fill="#22c55e">
      <animate attributeName="width" values="0;120;180;140;100" keyTimes="0;0.2;0.5;0.7;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="328" y="16" font-family="monospace" font-size="10" fill="#94a3b8">
      <animate attributeName="textContent" values="12%;38%;56%;44%;31%" keyTimes="0;0.2;0.5;0.7;1" dur="6s" repeatCount="indefinite"/>12%
    </text>

    <text x="0" y="44" font-family="monospace" font-size="10" fill="#64748b">RAM</text>
    <rect x="40" y="34" width="280" height="16" rx="8" fill="#1e293b"/>
    <rect x="40" y="34" width="0" height="16" rx="8" fill="#3b82f6">
      <animate attributeName="width" values="0;90;150;200;130" keyTimes="0;0.3;0.6;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="328" y="46" font-family="monospace" font-size="10" fill="#94a3b8">
      <animate attributeName="textContent" values="8%;24%;40%;53%;34%" keyTimes="0;0.3;0.6;0.75;1" dur="6s" repeatCount="indefinite"/>8%
    </text>
  </g>

  <!-- State machine -->
  <g transform="translate(36, 168)">
    <text x="0" y="0" font-family="monospace" font-size="9" font-weight="700" fill="#64748b">STATE MACHINE</text>

    <!-- 4 states in a flow -->
    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <g>
        <rect x="0" y="10" width="70" height="24" rx="4" fill="#1e293b" stroke="#22c55e"/>
        <text x="35" y="26" text-anchor="middle" fill="#22c55e">IDLE</text>
        <animate attributeName="opacity" values="1;0.5;1;0.5;1;0.5;1;0.5;1" keyTimes="0;0.05;0.1;0.3;0.35;0.55;0.6;0.85;0.9" dur="6s" repeatCount="indefinite"/>
      </g>
      <line x1="74" y1="22" x2="88" y2="22" stroke="#475569" stroke-width="1"/>
      <text x="81" y="18" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">→</text>

      <g>
        <rect x="92" y="10" width="70" height="24" rx="4" fill="#1e293b" stroke="#f59e0b"/>
        <text x="127" y="26" text-anchor="middle" fill="#f59e0b">BUSY</text>
        <animate attributeName="opacity" values="0.5;1;0.5;1;0.5;1;0.5;1;0.5" keyTimes="0;0.1;0.15;0.35;0.4;0.6;0.65;0.9;0.95" dur="6s" repeatCount="indefinite"/>
      </g>
      <line x1="166" y1="22" x2="180" y2="22" stroke="#475569" stroke-width="1"/>
      <text x="173" y="18" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">→</text>

      <g>
        <rect x="184" y="10" width="70" height="24" rx="4" fill="#1e293b" stroke="#ef4444"/>
        <text x="219" y="26" text-anchor="middle" fill="#ef4444">OVER</text>
        <animate attributeName="opacity" values="0.5;1;0.5;1;0.5;1;0.5;1;0.5" keyTimes="0;0.15;0.2;0.4;0.45;0.65;0.7;0.95;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <line x1="258" y1="22" x2="272" y2="22" stroke="#475569" stroke-width="1"/>

      <g>
        <rect x="276" y="10" width="80" height="24" rx="4" fill="#1e293b" stroke="#06b6d4"/>
        <text x="316" y="26" text-anchor="middle" fill="#06b6d4">RECOVER</text>
        <animate attributeName="opacity" values="0.5;1;0.5;1;0.5;1;0.5;1;0.5" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.05;0.1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">prevents OOM under heavy fan-out</text>
</svg>
