<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Ticketing animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#0f172a" stroke="#334155"/>

  <text x="36" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">2. TICKETING</text>
  <text x="36" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">crystallizes opportunity → ticket</text>

  <!-- Ticket file being assembled -->
  <g transform="translate(36, 90)">
    <rect width="408" height="140" rx="6" fill="#020617" stroke="#1e293b"/>

    <!-- Frontmatter -->
    <text x="14" y="20" font-family="monospace" font-size="10" fill="#ef4444">---</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.1;0.95;1" dur="5s" repeatCount="indefinite"/>
      <text x="14" y="36" font-family="monospace" font-size="10" fill="#22c55e">id:</text>
      <text x="50" y="36" font-family="monospace" font-size="10" fill="#f8fafc">TKT-P0-104</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.2;1" dur="5s" repeatCount="indefinite"/>
      <text x="14" y="52" font-family="monospace" font-size="10" fill="#22c55e">priority:</text>
      <text x="78" y="52" font-family="monospace" font-size="10" fill="#f8fafc">P0</text>
      <text x="120" y="52" font-family="monospace" font-size="10" fill="#22c55e">status:</text>
      <text x="170" y="52" font-family="monospace" font-size="10" fill="#3b82f6">QUEUED</text>
    </g>
    <text x="14" y="68" font-family="monospace" font-size="10" fill="#ef4444">---</text>

    <!-- AC -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.35;1" dur="5s" repeatCount="indefinite"/>
      <text x="14" y="86" font-family="monospace" font-size="10" fill="#a855f7">## Acceptance</text>
      <text x="14" y="102" font-family="monospace" font-size="10" fill="#94a3b8">- [ ] validate tenant_id</text>
      <text x="14" y="116" font-family="monospace" font-size="10" fill="#94a3b8">- [ ] fix race condition</text>
    </g>

    <!-- Evidence -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="5s" repeatCount="indefinite"/>
      <text x="220" y="86" font-family="monospace" font-size="10" fill="#06b6d4">## Evidence</text>
      <text x="220" y="102" font-family="monospace" font-size="10" fill="#94a3b8">src/lease.py:18</text>
      <text x="220" y="116" font-family="monospace" font-size="10" fill="#94a3b8">src/lease.py:42</text>
    </g>

    <!-- Cursor blink at end -->
    <rect x="280" y="124" width="8" height="12" fill="#22c55e" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="36" y="252" font-family="monospace" font-size="10" fill="#94a3b8">AC + evidence + expert reviews</text>
</svg>
